<!DOCTYPE html>
<html lang="zh-CN">

    <title>工会智慧服务</title>
    <!--preload-links-->
    <!--app-context-->
    <script type="module" crossorigin src="./assets/index-Wf6lzTWz.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DPp4kumY.css">
    <script>
      // 处理 GitHub Pages 刷新后的路由
      (function() {
        // 如果 URL 中有路径但没有 hash，转换为 hash 路由
        var pathname = window.location.pathname;
        var hash = window.location.hash;
        
        // 提取仓库名后的路径
        var repoName = '/union-smart-service';
        var pathAfterRepo = pathname;
        if (pathname.indexOf(repoName) === 0) {
          pathAfterRepo = pathname.substring(repoName.length);
        }
        
        // 如果有路径且没有 hash，转换为 hash 路由
        if (pathAfterRepo && pathAfterRepo !== '/' && pathAfterRepo !== '/index.html' && !hash) {
          var newHash = '#/' + pathAfterRepo.replace(/^\//, '');
          window.history.replaceState({}, '', window.location.origin + pathname.substring(0, pathname.indexOf(pathAfterRepo)) + '/' + newHash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"><!--app-html--></div>
  </body>
</html>
