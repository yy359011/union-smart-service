    <title>工会智慧服务</title>

    <script type="module" crossorigin src="./assets/index-ma3lg99u.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DPp4kumY.css">
    <script>
      // 处理 GitHub Pages 重定向
      (function() {
        var search = window.location.search;
        var match = search.match(/[?&]redirect=([^&]+)/);
        if (match) {
          var redirectPath = decodeURIComponent(match[1]);
          // 移除 redirect 参数，保留其他参数
          var newSearch = search.replace(/[?&]redirect=[^&]+/, '').replace(/^\?/, '');
          if (newSearch) {
            redirectPath += '?' + newSearch;
          }
          // 使用 history.replaceState 更新 URL，不刷新页面
          window.history.replaceState({}, '', redirectPath);
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"><!--app-html--></div>
  </body>
</html>
