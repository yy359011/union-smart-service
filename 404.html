<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>工会智慧服务</title>
    <script>
      // GitHub Pages SPA 路由重定向
      // 将路径从 /xxx 转换为 /?path=xxx
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      
      // 移除仓库名前缀（如果有）
      var repoName = '/union-smart-service';
      if (path.indexOf(repoName) === 0) {
        path = path.substring(repoName.length);
      }
      
      // 构建新的 URL
      var newUrl = window.location.origin + window.location.pathname.split('/').slice(0, -1).join('/') + '/';
      if (path && path !== '/') {
        newUrl = window.location.origin + repoName + '/?redirect=' + encodeURIComponent(path + search + hash);
      }
      
      window.location.replace(newUrl);
    </script>
  </head>
  <body>
    <p>正在跳转...</p>
  </body>
</html>
