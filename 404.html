<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>工会智慧服务</title>
    <script>
      // GitHub Pages SPA 路由重定向
      // 将任意路径重定向到根路径，保留 hash 路由
      var pathname = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      
      // 如果 URL 中没有 hash，添加一个
      if (!hash || hash === '#') {
        // 从 pathname 中提取路径作为 hash
        var pathParts = pathname.split('/');
        var lastPart = pathParts[pathParts.length - 1];
        if (lastPart && lastPart !== '' && lastPart !== 'index.html') {
          hash = '#/' + lastPart;
        }
      }
      
      // 重定向到根路径
      window.location.replace(window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1) + '/' + hash);
    </script>
  </head>
  <body>
    <p>正在跳转...</p>
  </body>
</html>
